[server]
bind-address=":8080"
mode="debug"  # GIN mode. Either debug, release or test
boiler-mode="debug"  # Either debug or something else.
rollbar-token=""
rollbar-environment="development"
http-pprof-pass=""

[mdb]
url="postgres://user:password@localhost/mdb?sslmode=disable"

[test]
enable-online-eval=false
search-data="./search/data/"
test-source-content-docx="$GOPATH/src/github.com/Bnei-Baruch/archive-backend/es/TEST-CONTENT.docx"
test-sources-folder="/tmp/test-sources-folder"
mdb-url="postgres://user:password@localhost/mdb?sslmode=disable"
url-template="postgres://user:password@localhost/%s?sslmode=disable"
#for windows:
#test-source-content-docx="C://Users//[USERNAME]//go//src//github.com//Bnei-Baruch//archive-backend//es//TEST-CONTENT.docx"
#test-sources-folder="C://test-sources-folder"

[elasticsearch]
url="http://127.0.0.1:9200"
data-folder="data"  # At repo, see: ./data
sources-folder="/tmp/sources-folder"
unzip-url=""
prepare-docs-batch-size=20
prepare-docs-parallelism=2
#index-date = "2018-11-28t13:08:31-05:00" # optional, NOT FOR PRODUCTION, comment out to use alias.
#grammar-index-date = "2018-11-28t13:08:31-05:00" # optional, NOT FOR PRODUCTION, comment out to use alias.
check-typo=true
timeout-for-highlight="8s"

[nats]
url="nats://localhost:4222"
client-id="my-sample-nats-client"
cluster-id="my-nats-cluster-id"
subject="subject"
durable=false
durable-name="test-name" # name for durable subscribtion meaning it will start from where it finished last time

[file_service]
url1="http://files.kabbalahmedia.info/api/v1/get"

[assets_service]
url="https://kabbalahmedia.info/assets/api/"

[feed_service]
url="https://kabbalahmedia.info/feed_api/"

[content_unit_images]
url_template="https://kabbalahmedia.info/imaginary/thumbnail?url=http%%3A%%2F%%2Fnginx%%2Fassets%%2Fapi%%2Fthumbnail%%2F%s&width=140&stripmeta=true"

[cache]
refresh-search-stats="5m"

[llm]
provider="openai" # "openai", "openrouter", "ollama", "zai"
postgresql-tool-cache-ttl="3h" # default is 3h when unset; set to "0s" to disable PostgreSQL tool cache
ai-tools-provider="openai" # "openai", "openrouter", "ollama", "zai"; defaults to llm.provider when empty
reasoning-search-verification-enabled=false
reasoning-search-verification-provider="openai" # "openai", "openrouter", "ollama", "zai"; defaults to llm.provider when empty

[openai]
token="sk-..."
api-endpoint="" # optional custom OpenAI-compatible API base URL for gpt-oss, e.g. http://localhost:1234 or http://localhost:1234/v1
reasoning-search-model="gpt-5.4" # "gpt-5.4-mini", "gpt-5.4-nano", "gpt-oss-20b", "gpt-oss-120b"
reasoning-search-effort="high" # gpt-oss supports only "low", "medium", "high"; invalid values return an error
reasoning-search-max-output-tokens=8000
reasoning-search-max-iterations=20
reasoning-search-rerun-max-iterations=2 # post-verification reasoning rerun
ai-tools-model="gpt-5.4-nano" # cheaper reader model for query_source_ai / query_transcript_ai
ai-tools-effort="low"
ai-tools-max-output-tokens=1500
# reasoning-search-verification-model="gpt-5.4-mini"
# reasoning-search-verification-effort="medium"
# reasoning-search-verification-max-output-tokens=2000
reasoning-session-ttl="30m"
request-timeout="2m"

[[openai.pricing]]
model="gpt-5.4"
input_per_1m_tokens_usd=2.50
cached_input_per_1m_tokens_usd=0.25
output_per_1m_tokens_usd=15.00

[[openai.pricing]]
model="gpt-5.4-mini"
input_per_1m_tokens_usd=0.75
cached_input_per_1m_tokens_usd=0.075
output_per_1m_tokens_usd=4.50

[[openai.pricing]]
model="gpt-5.4-nano"
input_per_1m_tokens_usd=0.20
cached_input_per_1m_tokens_usd=0.02
output_per_1m_tokens_usd=1.25

[openrouter]
token="sk-or-..."
api-endpoint="" # optional; defaults to https://openrouter.ai/api/v1
reasoning-search-model="openai/gpt-oss-120b" # "openai/gpt-oss-20b", "openai/gpt-oss-120b", "google/gemma-4-31b-it", "google/gemma-4-26b-a4b-it"
reasoning-search-effort="high" # "minimal", "low", "medium", "high"
reasoning-search-max-output-tokens=3000
reasoning-search-max-iterations=8
reasoning-search-rerun-max-iterations=2 # post-verification reasoning rerun
ai-tools-model="openai/gpt-oss-120b"
ai-tools-effort="low"
ai-tools-max-output-tokens=1500
# reasoning-search-verification-model="openai/gpt-oss-20b"
# reasoning-search-verification-effort="medium"
# reasoning-search-verification-max-output-tokens=1500
reasoning-session-ttl="30m"
request-timeout="2m"
enforced-tool-use-iterations=1
provider-sort="latency" # "latency", "price", "throughput"
provider-require-parameters=false # set true only when you want strict provider capability matching
# provider-allow-fallbacks=true
# provider-only=["openai"]
# provider-ignore=["novita"]
# provider-preferred-max-latency=60

[[openrouter.pricing]]
model="openai/gpt-oss-20b"
input_per_1m_tokens_usd=0.03
output_per_1m_tokens_usd=0.14

[[openrouter.pricing]]
model="openai/gpt-oss-120b"
input_per_1m_tokens_usd=0.039
output_per_1m_tokens_usd=0.19

[[openrouter.pricing]]
model="google/gemma-4-31b-it"
input_per_1m_tokens_usd=0.14
output_per_1m_tokens_usd=0.40

[[openrouter.pricing]]
model="google/gemma-4-26b-a4b-it"
input_per_1m_tokens_usd=0.13
output_per_1m_tokens_usd=0.40

[ollama]
token="" # optional bearer token for Ollama-compatible servers
api-endpoint="https://ollama.kab.sh" # base URL; also accepts a full /api/generate or /api/chat URL
reasoning-search-model="gemma4:31b" # "gemma4:31b", "gpt-oss:20b", "gpt-oss:120b"
reasoning-search-effort="high" # "minimal", "low", "medium", "high"
reasoning-search-max-output-tokens=8000
reasoning-search-max-iterations=20
reasoning-search-rerun-max-iterations=2 # post-verification reasoning rerun
ai-tools-model="gemma4:31b"
ai-tools-effort="low"
ai-tools-max-output-tokens=1500
# reasoning-search-verification-model="gemma4:31b"
# reasoning-search-verification-effort="medium"
# reasoning-search-verification-max-output-tokens=2000
reasoning-session-ttl="30m"
request-timeout="5m"
num-ctx=32768
structured-output-prompt-schema=false # when true, also embed the JSON schema and explicit JSON-only instruction into the prompt
# temperature=0
# keep-alive="5m"

# Optional pricing entries for self-hosted or metered Ollama-compatible servers:
# [[ollama.pricing]]
# model="gemma4:31b"
# input_per_1m_tokens_usd=0
# output_per_1m_tokens_usd=0

[zai]
token="zai-..."
api-endpoint="" # optional; defaults to https://api.z.ai/api/paas/v4 and also accepts a full /chat/completions URL
do-sample=false # lower variance; good default for search/ranking consistency
# temperature=0.1 # supported range is 0..1; lower is usually more stable
# top-p=0.8 # supported range is >0..1; usually tune this instead of temperature, not both
# stop=["</json>"] # optional stop sequences from the provider API
reasoning-search-model="glm-5.1"
reasoning-search-effort="high" # "minimal", "low", "medium", "high", "xhigh"; non-minimal values map to Z.AI thinking enabled
reasoning-search-max-output-tokens=8000
reasoning-search-max-iterations=20
reasoning-search-rerun-max-iterations=2 # post-verification reasoning rerun
ai-tools-model="glm-5"
ai-tools-effort="low"
ai-tools-max-output-tokens=1500
# reasoning-search-verification-model="glm-5.1"
# reasoning-search-verification-effort="low"
# reasoning-search-verification-max-output-tokens=2000
reasoning-session-ttl="30m"
request-timeout="2m"

[[zai.pricing]]
model="glm-5"
input_per_1m_tokens_usd=1.00
cached_input_per_1m_tokens_usd=0.20
output_per_1m_tokens_usd=3.20

[[zai.pricing]]
model="glm-5.1"
input_per_1m_tokens_usd=1.00
cached_input_per_1m_tokens_usd=0.20
output_per_1m_tokens_usd=3.20
