reasoning-search-model="openai/gpt-oss-120b" # "openai/gpt-oss-20b", "openai/gpt-oss-120b", "google/gemma-4-31b-it", "google/gemma-4-26b-a4b-it", "qwen/qwen3.5-35b-a3b", "arcee-ai/trinity-large-thinking"
